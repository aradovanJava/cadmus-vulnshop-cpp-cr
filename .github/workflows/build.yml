# The pipeline as it exists today. It compiles the code and nothing else.
#
# CR4 asks you to add: a sanitizer job, a SAST gate (SonarQube), a Valgrind
# run, an SCA step and an SBOM artefact - and to make the build FAIL on new
# critical findings rather than publishing a report nobody reads.
name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Smoke test
        run: ./scripts/smoke_test.sh

      # No SAST. No SCA. No SBOM. No sanitizer run. No dependency review.
      # The token below can write to the repository, which it does not need.
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          CI_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        run: echo "publishing build artefact"
