; The configuration SAFETY.md tells you to use while the application is
; running on your own machine. It is not part of the exercise: it exists so
; that a deliberately exploitable service is not reachable from your network.
[server]
bind            = 127.0.0.1:8080
admin_port      = 0
tls_verify_peer = true

[database]
user     = vulnshop
password = changeme

[debug]
core_dumps              = disabled
stack_trace_in_response = false
