sonar.projectKey=cadmus-vulnshop-cpp-cr
sonar.projectName=CADMUS VulnShop C/C++ (CR1)
sonar.projectVersion=1.0

# Analysed sources. third_party/ is included on purpose: the vendored copies are
# part of what this project ships, and excluding them is a decision, not a default.
sonar.sources=src,third_party,include

# SonarQube's C/C++ analyser needs the compilation, not the source tree.
# tools/scan-sonar.* produce this directory with the build wrapper.
sonar.cfamily.build-wrapper-output=bw-output
sonar.cfamily.threads=2

sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Note for reviewers: adding tests/ to sonar.exclusions below would silence a
# finding that the lab expects you to triage. Think before you copy this file
# into another project.
# sonar.exclusions=tests/**
